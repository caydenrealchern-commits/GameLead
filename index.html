<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reactivation Sequence Builder</title>
<meta name="description" content="Name one old lead who went quiet and get the five messages that reopen them, including what to send when they ignore you.">

<!-- Link preview for LinkedIn, Facebook, WhatsApp, Slack, iMessage.
     These must stay absolute: scrapers do not resolve relative paths, and a
     relative og:image renders no card at all. If the site ever moves, these
     three URLs are the only thing that needs changing. -->

<meta property="og:site_name"   content="Volt">
<meta property="og:title"       content="Your old leads are not dead. They are unanswered.">
<meta property="og:description" content="Name one old lead who went quiet and get the five messages that reopen them, including what to send when they ignore you. Free, no signup.">
<meta property="og:url"         content="https://volt-reactivation.netlify.app/">
<meta property="og:image"       content="https://volt-reactivation.netlify.app/og.png">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt"   content="Your old leads are not dead. They are unanswered.">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="Your old leads are not dead. They are unanswered.">
<meta name="twitter:description" content="Name one old lead who went quiet and get the five messages that reopen them. Free, no signup.">
<meta name="twitter:image"       content="https://volt-reactivation.netlify.app/og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23c8f251'/><path d='M13 3 5 14h5l-1 7 8-11h-5l1-7Z' fill='%231d1d1f'/></svg>">
<style>
/* ---------------------------------------------------------------
   System font first (it ships optical sizing and tracking tables),
   flat surfaces, hairline separators. No gradients anywhere.
   --------------------------------------------------------------- */
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --ink:#1d1d1f;
  --ink2:#6e6e73;
  --ink3:#8e8e93;
  --line:rgba(0,0,0,.12);
  --line2:rgba(0,0,0,.20);
  --accent:#c8f251;
  --in:#e9e9eb;
  --r:13px;
  /* critically damped: settles without overshoot */
  --ease:cubic-bezier(.2,.8,.2,1);
  --resp:360ms;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 15px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding:0 0 56px;
}
.wrap{width:100%; max-width:428px; margin:0 auto; padding:20px 16px 0}
h1,h2,h3,h4{margin:0}
p{margin:0}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent}
a{color:inherit}

/* ---------- masthead ---------- */
.mast{display:flex; align-items:center; gap:8px; margin-bottom:24px}
.mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.mark svg{display:block}
.mast b{font-size:13px; font-weight:600; letter-spacing:-.01em}
.mast span{font-size:13px; color:var(--ink3); letter-spacing:-.01em}

/* ---------- screens ---------- */
.screen{display:none}
.screen.on{display:block; animation:enter var(--resp) var(--ease) both}
@keyframes enter{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

/* ---------- type ----------
   Tracking is size-specific: tight as it grows, near zero at body,
   slightly open for small uppercase labels. */
.eyebrow{font-size:11px; font-weight:590; letter-spacing:.055em; text-transform:uppercase; color:var(--ink3); margin-bottom:14px}
.h1{
  font-size:clamp(29px,7.4vw,34px); font-weight:680;
  letter-spacing:-.026em; line-height:1.08; margin-bottom:14px;
}
.h1 em{font-style:normal; text-decoration:underline; text-decoration-color:var(--accent);
  text-decoration-thickness:3px; text-underline-offset:3px}
.sub{color:var(--ink2); font-size:15.5px; line-height:1.47; letter-spacing:-.008em; margin-bottom:28px}

/* ---------- form ---------- */
.field{margin-bottom:14px}
.field label{display:block; font-size:12.5px; font-weight:590; color:var(--ink2); margin-bottom:7px; letter-spacing:-.005em}
.selwrap{position:relative}
.selwrap::after{
  content:''; position:absolute; right:16px; top:50%; width:7px; height:7px; margin-top:-5px;
  border-right:1.6px solid var(--ink3); border-bottom:1.6px solid var(--ink3);
  transform:rotate(45deg); pointer-events:none
}
select{
  -webkit-appearance:none; appearance:none; width:100%;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  color:var(--ink); padding:14px 40px 14px 14px; font-size:16px; font-weight:450;
  letter-spacing:-.01em; transition:border-color 140ms var(--ease);
}
select:focus{outline:none; border-color:var(--ink)}
select.empty{color:var(--ink3)}

.curr{display:flex; align-items:center; gap:10px; margin:20px 0 24px}
.curr span{font-size:12.5px; color:var(--ink2)}
.toggle{display:inline-flex; background:rgba(0,0,0,.05); border-radius:9px; padding:2px}
.toggle button{padding:5px 14px; border-radius:7px; font-size:13.5px; font-weight:560; color:var(--ink2); transition:none}
.toggle button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* ---------- buttons ----------
   Feedback lands on pointer-down, not on release. */
.btn{
  display:flex; align-items:center; justify-content:center; width:100%;
  background:var(--ink); color:#fff; font-weight:590; font-size:15.5px; letter-spacing:-.014em;
  padding:15px 18px; border-radius:var(--r); text-decoration:none; text-align:center; text-wrap:balance;
  transition:transform 110ms var(--ease), opacity 140ms var(--ease);
}
.btn:active{transform:scale(.975)}
.btn[disabled]{background:transparent; color:var(--ink3); border:1px solid var(--line); cursor:not-allowed}
.btn[disabled]:active{transform:none}
.btn.ghost,.btn.alt{background:var(--card); color:var(--ink); border:1px solid var(--line2); font-weight:530}
.btn.sm{padding:12px 16px; font-size:14.5px}

.foot{margin-top:16px; font-size:12.5px; color:var(--ink3); text-align:center; line-height:1.5; letter-spacing:-.004em}

/* ---------- progress ---------- */
.rail{display:flex; gap:4px; margin-bottom:13px}
.rail i{flex:1; height:2px; border-radius:1px; background:rgba(0,0,0,.10); transition:background 280ms var(--ease)}
.rail i.done{background:var(--ink3)}
.rail i.now{background:var(--ink)}
.crumbs{display:flex; gap:5px; align-items:center; overflow-x:auto; margin-bottom:14px;
  scrollbar-width:none; -ms-overflow-style:none; padding-bottom:2px}
.crumbs::-webkit-scrollbar{display:none}
.crumb{
  flex:0 0 auto; font-size:11.5px; font-weight:560; letter-spacing:-.004em;
  padding:4px 9px; border-radius:7px; background:rgba(0,0,0,.05); color:var(--ink2); white-space:nowrap
}
.crumb.br{background:transparent; color:var(--ink3); font-weight:440}
.crumb.on{background:var(--ink); color:#fff}

/* ---------- phone ---------- */
.phone{background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden}
.phone-top{display:flex; align-items:center; gap:9px; padding:11px 14px; border-bottom:1px solid var(--line)}
.av{width:28px;height:28px;border-radius:50%;background:var(--in);color:var(--ink2);
  display:grid;place-items:center;font-size:12px;font-weight:590;flex:0 0 auto}
.phone-top b{font-size:13.5px; font-weight:590; display:block; line-height:1.25; letter-spacing:-.012em}
.phone-top small{color:var(--ink3); font-size:11.5px; letter-spacing:-.004em}
.thread{padding:14px 12px 16px; min-height:206px; display:flex; flex-direction:column; gap:8px}
.daystamp{align-self:center; font-size:11px; font-weight:590; letter-spacing:.045em;
  text-transform:uppercase; color:var(--ink3); margin:5px 0 3px}
.bubble{
  max-width:84%; padding:9px 13px; border-radius:17px; font-size:15px; line-height:1.4;
  letter-spacing:-.012em; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  animation:land 320ms var(--ease) both;
}
/* arrives from below, the direction it travels is where it came from */
@keyframes land{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.bubble.out{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:5px}
.bubble.in{align-self:flex-start; background:var(--in); border-bottom-left-radius:5px}
.bubble.silent{align-self:center; background:transparent; color:var(--ink3); font-size:12.5px;
  border:1px solid var(--line); border-radius:999px; padding:4px 12px; max-width:none; letter-spacing:-.004em}
.typing{align-self:flex-end; background:var(--in); border-radius:17px; border-bottom-right-radius:5px;
  padding:11px 14px; display:flex; gap:4px; animation:land 320ms var(--ease) both}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3); animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.3} 30%{opacity:.9}}

/* ---------- the teaching note ---------- */
.note{margin-top:14px; background:var(--card); border:1px solid var(--line);
  border-left:2px solid var(--accent); border-radius:var(--r); padding:13px 15px}
.note b{display:block; font-size:11px; font-weight:590; letter-spacing:.055em;
  text-transform:uppercase; color:var(--ink3); margin-bottom:6px}
.note p{font-size:14px; color:var(--ink); line-height:1.5; letter-spacing:-.008em}

/* ---------- branch choices ---------- */
.choices{margin-top:16px}
.choices h4{font-size:12.5px; font-weight:590; color:var(--ink2); margin:0 0 9px; letter-spacing:-.005em}
.reply{
  display:block; width:100%; text-align:left; margin-bottom:8px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 15px; font-size:15px; letter-spacing:-.012em; color:var(--ink);
  transition:transform 110ms var(--ease), border-color 140ms var(--ease);
}
.reply:hover{border-color:var(--line2)}
.reply:active{transform:scale(.985)}
.reply.quiet{background:transparent; color:var(--ink2)}
.reply .tag{display:block; font-size:12px; color:var(--ink3); margin-top:3px; letter-spacing:-.004em}

.nav{display:flex; gap:8px; margin-top:16px}
.nav .btn{flex:1}
.back{flex:0 0 auto; width:50px; background:var(--card); border:1px solid var(--line2);
  border-radius:var(--r); display:grid; place-items:center; color:var(--ink2);
  transition:transform 110ms var(--ease)}
.back:active{transform:scale(.975)}
.back:disabled{opacity:.4; cursor:not-allowed}
.back:disabled:active{transform:none}

/* ---------- endings ---------- */
.end{text-align:center; padding:6px 0 0}
.badge{display:inline-flex; font-size:11px; font-weight:590; letter-spacing:.055em;
  text-transform:uppercase; padding:5px 11px; border-radius:7px; margin-bottom:16px;
  background:rgba(0,0,0,.05); color:var(--ink2)}
.badge.won{background:var(--accent); color:var(--ink)}
.end h2{font-size:23px; font-weight:660; letter-spacing:-.022em; line-height:1.18; margin-bottom:12px}
.end .body{color:var(--ink2); font-size:15px; line-height:1.5; letter-spacing:-.008em; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin-bottom:16px}
.quietoffer{font-size:13.5px; color:var(--ink2); line-height:1.5; margin:18px 0 0;
  text-align:left; letter-spacing:-.006em}
.quietoffer a{font-weight:560; color:var(--ink); text-decoration:underline; text-underline-offset:2px}

/* ---------- copy-out ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px}
.card h2{font-size:21px; font-weight:660; margin-bottom:8px; letter-spacing:-.022em}
.card .lede{color:var(--ink2); font-size:14.5px; margin-bottom:16px; line-height:1.47; letter-spacing:-.008em}
.err{font-size:13px; color:#c1121f; margin-bottom:10px; display:none}
.err.on{display:block}

/* 12px/20px with 14px padding: the box ends exactly on a line, so the
   cut reads as deliberate and needs no fade to explain it. */
.dump{
  background:var(--bg); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:12px; line-height:20px; color:var(--ink2);
  max-height:208px; overflow-y:auto; margin-bottom:9px;
}
.dump span{display:block; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere}
.hint{font-size:12.5px; color:var(--ink3); margin-bottom:13px; letter-spacing:-.004em}
.textlink{display:block; width:100%; text-align:center; padding:12px; font-size:13.5px;
  color:var(--ink2); text-decoration:underline; text-underline-offset:3px}

.offer{margin-top:18px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px}
.offer::before{content:''; display:block; width:26px; height:2px; background:var(--accent); margin-bottom:14px}
.offer h3{font-size:19px; font-weight:660; margin-bottom:11px; letter-spacing:-.022em; line-height:1.25}
.terms{list-style:none; margin:0 0 17px; padding:0; border-top:1px solid var(--line)}
.terms li{border-bottom:1px solid var(--line); padding:10px 0; font-size:14px;
  color:var(--ink); letter-spacing:-.008em; line-height:1.4}
.offer p{color:var(--ink2); font-size:15px; line-height:1.5; letter-spacing:-.008em; margin-bottom:11px}
.offer p:last-of-type{margin-bottom:17px}
.compliance{margin-top:22px; font-size:12px; color:var(--ink3); line-height:1.5; letter-spacing:-.004em}

/* ---------- act 1: the inbox where they name a lead ---------- */
.inbox-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:9px}
.inbox-head h2{font-size:23px; font-weight:660; letter-spacing:-.022em}
.inbox-meta{flex:0 0 auto; font-size:11.5px; color:var(--ink3); letter-spacing:-.004em; text-align:right}
.emptybox{background:var(--card); border:1px dashed var(--line2); border-radius:var(--r);
  padding:20px 16px; text-align:center; font-size:14px; color:var(--ink3);
  letter-spacing:-.006em; line-height:1.5; margin-bottom:14px}
input[type=text]{
  width:100%; background:var(--card); border:1px solid var(--line2); border-radius:var(--r);
  color:var(--ink); padding:14px; font-size:16px; margin-bottom:10px;
  font-family:inherit; letter-spacing:-.01em;
}
input[type=text]:focus{outline:none; border-color:var(--ink)}
.chip.fresh{background:rgba(0,0,0,.05); color:var(--ink2)}

/* ---------- act 2: the campaign inbox ----------
   Status is the only place colour carries meaning here, so the chips are
   the one strongly coloured element and the accent stays out of their way. */
.framing{font-size:16px; font-weight:590; letter-spacing:-.016em; line-height:1.35;
  margin:18px 0 14px; text-align:left}
.tally{display:flex; flex-direction:column; gap:5px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:11px 14px 12px; margin-bottom:10px}
.tally-nums{font-size:14px; color:var(--ink2); letter-spacing:-.008em;
  font-variant-numeric:tabular-nums; line-height:1.45}
.tally-nums b{color:var(--ink); font-weight:640}
.tally-nums i{color:var(--ink3); font-style:normal; margin:0 1px}
.tally-day{order:-1; font-size:11px; font-weight:590; letter-spacing:.055em;
  text-transform:uppercase; color:var(--ink3)}
.daynote{font-size:13.5px; color:var(--ink2); line-height:1.5; letter-spacing:-.006em;
  margin-bottom:16px}

.rows{display:flex; flex-direction:column; gap:7px; margin-bottom:18px}
.row{display:flex; gap:11px; width:100%; text-align:left; align-items:flex-start;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 13px; transition:transform 110ms var(--ease), border-color 140ms var(--ease)}
.row:hover{border-color:var(--line2)}
.row:active{transform:scale(.99)}
.row.star{border-color:var(--ink)}
.row-av{width:30px;height:30px;border-radius:50%;background:var(--in);color:var(--ink2);
  display:grid;place-items:center;font-size:12.5px;font-weight:590;flex:0 0 auto}
.row-main{flex:1; min-width:0}
.row-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.row-top b{font-size:14.5px; font-weight:590; letter-spacing:-.012em}
.row-main p{font-size:13px; color:var(--ink3); letter-spacing:-.006em; margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row.star .row-main p{white-space:normal; color:var(--ink2)}
#startlead .row-main p{color:var(--ink2); font-weight:500}
.flag{display:inline-block; margin-top:6px; font-size:11px; font-weight:590;
  letter-spacing:-.002em; color:var(--ink); background:var(--accent);
  border-radius:5px; padding:2px 7px}
.mine{display:block; margin-top:5px; font-size:11.5px; color:var(--ink3); letter-spacing:-.002em}

.chip{flex:0 0 auto; font-size:11px; font-weight:590; letter-spacing:.02em;
  padding:3px 8px; border-radius:6px; white-space:nowrap}
.chip.booked  {background:#1d1d1f; color:#fff}
.chip.declined{background:#f0e6e4; color:#8a3d2f}
.chip.noreply {background:rgba(0,0,0,.05); color:var(--ink3)}
.chip.waiting {background:rgba(0,0,0,.05); color:var(--ink2)}

.thread-head{display:flex; align-items:center; gap:11px; margin-bottom:12px}
.thread-head .back{width:38px; height:38px}
.thread-head div{flex:1; min-width:0}
.thread-head b{display:block; font-size:15px; font-weight:590; letter-spacing:-.014em}
.thread-head small{color:var(--ink3); font-size:12px; letter-spacing:-.004em}

@media (prefers-contrast:more){
  .chip.declined{background:#fff; color:#7a2e21; border:1px solid currentColor}
  .chip.noreply,.chip.waiting{border:1px solid var(--line2)}
}

@media (max-width:374px){
  .inbox-head{flex-direction:column; align-items:flex-start; gap:2px}
  .inbox-meta{text-align:left}
  .row-top b{font-size:14px}
  .chip{font-size:10.5px; padding:3px 6px}
}

@media (max-width:374px){
  .wrap{padding:16px 12px 0}
  .thread{padding:12px 10px 14px}
  .bubble{font-size:14.5px; max-width:88%}
  .btn{font-size:15px; padding:14px}
  .crumb{font-size:11px; padding:4px 8px}
}

/* ---------- accessibility signals ---------- */
@media (prefers-contrast:more){
  :root{--line:rgba(0,0,0,.42); --line2:rgba(0,0,0,.6); --ink2:#3a3a3c; --ink3:#48484a}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#0d0e12"/></svg></div>
    <b>Volt</b><span>· Reactivation Sequence Builder</span>
  </div>
  <div id="app"></div>
</div>

<script>
/* ============================ CONFIG START ============================ */

var CONFIG = {
  bookingUrl:   'https://calendly.com/caydenrealchern/30min',
  bookingLabel: 'Book a free 30 minute call',
  offerHeading: 'Ten was the demo. Your list is the campaign.',
  offerBody: [
    "Sending is the easy part. The part nobody keeps up with is doing it across every old lead you have: tracking who replies, stopping the sequence the second someone answers. So I run it for you, up to 10,000 leads in one campaign.",
    "Nothing to pay to set it up and nothing to pay to run it. We agree how many reactivated leads you want before anything sends, and the fee is only due once you have them. Miss the number and you owe me nothing.",
    "What a list returns depends on the list, which is exactly why we set that number together rather than me promising you one."
  ],
  /* the three facts that make the offer, read before the button is pressed */
  offerTerms: [
    'Up to 10,000 leads in a single campaign',
    'Nothing to pay up front: setup and sending included',
    'You pay only once your agreed number of reactivated leads is hit'
  ],
  quietOffer: 'Want this run across your whole list? Up to 10,000 leads, nothing up front, and you pay only once your target is hit. ',
  quietOfferLink: 'Book a 30 minute call',

  typingMs: 600,
  currencyDefault: null,    /* null = detect from navigator.language */

  sender:   '[your name]',
  business: '[your business]',

  days: { m1:0, m2c:3, m3:7, m4:14 },

  act1Leads: 1,

  leadEntry: {
    title:       'Your inbox',
    lede:        'Start with one real lead: someone who asked you for a price and then went quiet. A first name is enough.',
    placeholder: 'e.g. Dave Wilson',
    add:         'Add to inbox',
    empty:       'Nothing in here yet. Add the lead you keep meaning to chase.',
    ready:       'Tap the row to open the conversation.',
    change:      'Use a different name',
    error:       'Give the lead a name first.'
  },
  campaignSize: 10,
  revealDays: [0, 3, 7, 14],
  act2: {
    framing:    'That’s one lead. Now the part that actually matters: the same sequence across a whole list.',
    enterCta:   'See it run across ten',
    lede:       'Same five messages, sent to ten old leads on the same schedule. The first one is the lead you just handled yourself.',
    tally:      { messaged:'messaged', booked:'booked', declined:'declined', noreply:'no reply', waiting:'still out' },
    skip:       'Skip to the result',
    advance:    'Advance to day',
    continueCta:'Get the sequence',
    m4Flag:     'Booked off message 4'
  },

  compliance: 'These messages assume the person already asked you for a price. Opt-out wording and the rules where you operate are your responsibility, not this tool’s.'
};

/* ============================ ASSEMBLY ============================ */

function joinParts(parts){
  return parts.filter(function(x){ return x && String(x).trim(); })
              .map(function(x){ return String(x).trim(); })
              .join(' ');
}

function buildSequence(industryKey, valueKey, coldKey){
  var I = COPY.industries[industryKey],
      T = COPY.tones[valueKey],
      O = COPY.openers[coldKey],
      r = T.register;

  var head = (O.pre[r] + ' ' + I.m1ref[r] + O.post[r])
               .replace('{s}', CONFIG.sender)
               .replace('{b}', CONFIG.business);

  return {
    m1:  joinParts([ head, T.reason ? O.reason : '', I.m1q[r], T.m1tail ]),
    m2a: joinParts([ T.m2aLead, I.m2a[r], T.m2aTail ]),
    m2b: joinParts([ T.m2bLead, I.m2b[r] ]),
    m2c: joinParts([ I.m2c[r], T.m2cTail ]),
    m3:  joinParts([ I.m3[r], T.m3Tail ]),
    m4:  joinParts([ T.m4Lead, I.m4[r] ])
  };
}

/* ===================== CAMPAIGN =====================
   Ten leads, one fixed distribution. Not randomised: a run where nobody
   books argues against the tool, and a run where everybody books is not
   believable. Act 1 forces the user's two leads to different endings, so
   only ten input combinations are reachable and every one of them totals
   exactly 3 booked / 1 declined / 6 no reply.                            */

var RESOLVE_DAY = { m1:0, m2b:0, m2c:3, m4:14, end:14 };

/* where a finished act-1 lead lands in the campaign */
function slotFor(rec){
  if (rec.outcome === 'won')    return ['booked',   rec.stage];   /* m1 or m2c */
  if (rec.outcome === 'parked') return ['declined', 'm2b'];
  return ['noreply', 'end'];
}

function buildCampaign(userLeads){
  var pool = [ ['booked','m1'], ['booked','m2c'], ['booked','m4'], ['declined','m2b'] ];
  for (var i = 0; i < 6; i++) pool.push(['noreply','end']);

  var leads = [], names = COPY.campaign.names, u, j, ix, want;

  /* the user's leads claim their slot out of the pool first */
  for (u = 0; u < userLeads.length; u++){
    want = slotFor(userLeads[u]);
    ix = -1;
    for (j = 0; j < pool.length; j++)
      if (pool[j][0] === want[0] && pool[j][1] === want[1]){ ix = j; break; }
    if (ix < 0)
      for (j = 0; j < pool.length; j++) if (pool[j][0] === want[0]){ ix = j; break; }
    if (ix >= 0) pool.splice(ix, 1);
    leads.push({ name:S.leadName || names[u], outcome:want[0], stage:want[1], byUser:true });
  }

  /* Spread what is left through the list so the resolved ones do not clump at
     the top and the message 4 booking is never last. Computed rather than a
     fixed table, so it holds however many leads the user names themselves. */
  var quiet = [], loud = [], slots = [], n = pool.length;
  for (j = 0; j < n; j++) (pool[j][0] === 'noreply' ? quiet : loud).push(pool[j]);
  var gap = n / (loud.length + 1);
  for (j = 0; j < loud.length; j++){
    var at = Math.min(n - 1, Math.max(0, Math.round(gap * (j + 1)) - 1));
    while (slots[at]) at = (at + 1) % n;          /* never overwrite a placed lead */
    slots[at] = loud[j];
  }
  for (j = 0; j < n; j++) if (!slots[j]) slots[j] = quiet.shift();

  var counters = {};
  for (j = 0; j < slots.length; j++){
    if (!slots[j]) continue;
    leads.push({ name:names[leads.length], outcome:slots[j][0], stage:slots[j][1], byUser:false });
  }

  /* attach the reply each thread came back with */
  for (j = 0; j < leads.length; j++){
    var L = leads[j];
    L.resolveDay = RESOLVE_DAY[L.stage];
    if (L.outcome === 'noreply'){ L.reply = null; continue; }
    if (L.byUser){
      var I = COPY.industries[S.industry], r = COPY.tones[S.value].register;
      L.reply = (L.outcome === 'booked') ? I.yes[r] : I.no[r];
    } else {
      var bank = COPY.campaign.replies[L.stage] || [];
      counters[L.stage] = (counters[L.stage] || 0);
      L.reply = bank[counters[L.stage] % bank.length];
      counters[L.stage]++;
    }
  }
  return leads;
}

/* the full thread for one campaign lead, from the same generated sequence */
function threadFor(L){
  var out = [ { t:'out', msg:'m1', day:'m1' } ];
  if (L.stage === 'm1' || L.stage === 'm2b'){
    out.push({ t:'in', text:L.reply });
    out.push({ t:'out', msg:(L.stage === 'm1' ? 'm2a' : 'm2b'), day:'reply' });
    return out;
  }
  out.push({ t:'silent', text:'three days pass · nothing' });
  out.push({ t:'out', msg:'m2c', day:'m2c' });
  if (L.stage === 'm2c'){
    out.push({ t:'in', text:L.reply });
    out.push({ t:'out', msg:'m2a', day:'reply' });
    return out;
  }
  out.push({ t:'silent', text:'four more days · still nothing' });
  out.push({ t:'out', msg:'m3', day:'m3' });
  out.push({ t:'silent', text:'a week goes by · still nothing' });
  out.push({ t:'out', msg:'m4', day:'m4' });
  if (L.stage === 'm4'){
    out.push({ t:'in', text:L.reply });
    out.push({ t:'out', msg:'m2a', day:'reply' });
  }
  return out;
}

function tally(){
  var d = CONFIG.revealDays[S.dayIdx], t = { booked:0, declined:0, noreply:0, waiting:0 };
  for (var i = 0; i < S.campaign.length; i++){
    var L = S.campaign[i];
    if (L.resolveDay <= d) t[L.outcome]++; else t.waiting++;
  }
  return t;
}

  d1:      { k:'choice', prompt:'What does the lead do?', opts:[
               { kind:'yes',  next:'ry1', term:'won' },
               { kind:'no',   next:'rn1', term:'parked' },
               { kind:'none', next:'s1', label:'They don’t reply at all', tag:'The branch most campaigns die in' } ] },
  ry1:     { k:'reply', kind:'yes', next:'m2a' },
  rn1:     { k:'reply', kind:'no',  next:'m2b' },
  s1:      { k:'silence', text:'three days pass · nothing', next:'m2c' },

  m2a:     { k:'send', msg:'m2a', day:'reply', next:'won' },
  m2b:     { k:'send', msg:'m2b', day:'reply', next:'parked' },
  m2c:     { k:'send', msg:'m2c', day:'m2c',   next:'d2' },

  d2:      { k:'choice', prompt:'And this time?', opts:[
               { kind:'yes',  next:'ry2', term:'won' },
               { kind:'none', next:'s2', term:'cleaned', label:'Still nothing', tag:'Most people stop here. Two messages left.' } ] },
  ry2:     { k:'reply', kind:'yes', next:'m2a' },
  s2:      { k:'silence', text:'four more days · still nothing', next:'m3' },

  m3:      { k:'send', msg:'m3', day:'m3', next:'s3' },
  s3:      { k:'silence', text:'a week goes by · still nothing', next:'m4' },
  m4:      { k:'send', msg:'m4', day:'m4', next:'cleaned' },

  won:     { k:'end', outcome:'won' },
  parked:  { k:'end', outcome:'parked' },
  cleaned: { k:'end', outcome:'cleaned' }
};

var DAY_LABEL = { m1:'Day 0', m2c:'Day 3', m3:'Day 7', m4:'Day 14', reply:'Within the hour' };
var MSG_TITLE = { m1:'The re-open', m2a:'Book the slot', m2b:'The graceful exit',
                  m2c:'The nudge', m3:'The reason to act now', m4:'The close-out' };

var S = {
  screen:'intro',
  industry:'', value:'', cold:'',
  cur:'£',
  seq:null,
  trail:['m1'],
  history:[],
  animate:'m1',
  outcome:null,
  copied:false,

  /* act 1 runs once per guided lead; act 2 works off what they produced */
  leadIdx:0,
  leadName:'',
  leadOutcomes:[],
  campaign:null,
  dayIdx:0,
  openLead:null,
  inboxScroll:0
};

/* ============================ HELPERS ============================ */

var app = document.getElementById('app');
var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function esc(t){
  return String(t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function node(id){ return GRAPH[id]; }
function stageOfTrail(outcome){
  if (outcome === 'parked')  return 'm2b';
  if (outcome === 'cleaned') return 'end';
  /* won: booked off message 1, or off the day-3 nudge */
  return S.trail.indexOf('ry2') > -1 ? 'm2c' : 'm1';
}
function last(){ return S.trail[S.trail.length - 1]; }
function cur(){ return node(last()); }
function bandLabel(k){ return COPY.tones[k].label.replace(/\{c\}/g, S.cur); }
function detectCur(){
  if (CONFIG.currencyDefault) return CONFIG.currencyDefault;
  var l = (navigator.language || 'en-GB');
  return /^en-GB|^cy|^gd/i.test(l) ? '£' : '$';
}

/* push a node, then keep pushing while the node just added is a
   non-interactive beat (a lead reply, or a stretch of silence) */
function pushChain(id){
  S.trail.push(id);
  var n = node(id);
  while (n && (n.k === 'reply' || n.k === 'silence')) {
    S.trail.push(n.next);
    n = node(n.next);
  }
  var tail = cur();
  S.animate = (tail && tail.k === 'send') ? last() : null;
}
/* on the second guided lead, hide branches that only lead back to an ending
   already seen. The inbox makes no sense unless two different things happened */
function openOpts(n){
  var seen = {}, i;
  for (i = 0; i < S.leadIdx; i++){
    if (S.leadOutcomes[i]) seen[S.leadOutcomes[i].outcome] = true;
  }
  var out = [];
  for (i = 0; i < n.opts.length; i++){
    if (n.opts[i].term && seen[n.opts[i].term]) continue;
    out.push(n.opts[i]);
  }
  return out.length ? out : n.opts;
}

function go(id){ S.history.push(S.trail.slice()); pushChain(id); render(); }
function back(){
  if (!S.history.length) return;
  S.trail = S.history.pop();
  S.animate = null;
  render();
}

function threadHtml(){
  var out = '', lastDay = null;
  for (var i = 0; i < S.trail.length; i++){
    var id = S.trail[i], n = node(id);
    if (!n) continue;
    if (n.k === 'send'){
      var dl = DAY_LABEL[n.day];
      if (dl !== lastDay){ out += '<div class="daystamp">'+esc(dl)+'</div>'; lastDay = dl; }
      if (id === S.animate && !reduced){
        out += '<div class="typing" id="typing"><i></i><i></i><i></i></div>';
      } else {
        out += '<div class="bubble out">'+esc(S.seq[n.msg])+'</div>';
      }
    } else if (n.k === 'reply'){
      var I = COPY.industries[S.industry], r = COPY.tones[S.value].register;
      out += '<div class="bubble in">'+esc(I[n.kind][r])+'</div>';
    } else if (n.k === 'silence'){
      out += '<div class="bubble silent">'+esc(n.text)+'</div>';
    }
  }
  return out;
}

function railHtml(){
  var sends = 0, crumbs = '';
  for (var i = 0; i < S.trail.length; i++){
    var id = S.trail[i], n = node(id);
    if (!n) continue;
    var isLast = (i === S.trail.length - 1);
    if (n.k === 'send'){
      sends++;
      crumbs += '<span class="crumb'+(isLast?' on':'')+'">'+esc(DAY_LABEL[n.day])+'</span>';
    } else if (n.k === 'reply'){
      crumbs += '<span class="crumb br">'+(n.kind === 'yes' ? 'interested' : 'not interested')+'</span>';
    } else if (n.k === 'silence'){
      crumbs += '<span class="crumb br">no reply</span>';
    }
  }
  var bars = '';
  for (var j = 1; j <= 4; j++){
    bars += '<i class="'+(j < sends ? 'done' : j === sends ? 'now' : '')+'"></i>';
  }
  return '<div class="rail">'+bars+'</div><div class="crumbs" id="crumbs">'+crumbs+'</div>';
}

function screenWalk(){
  var n = cur(), I = COPY.industries[S.industry], r = COPY.tones[S.value].register;
  var body = '<div class="screen on">' + railHtml()
    + '<div class="phone">'
      + '<div class="phone-top"><div class="av">'+esc(S.leadName.charAt(0).toUpperCase())+'</div>'
        + '<div><b>'+esc(S.leadName)+'</b><small>'+esc(I.who)+' · '+esc(bandLabel(S.value))
          +'</small></div></div>'
      + '<div class="thread" id="thread">'+threadHtml()+'</div>'
    + '</div>';

  if (n.k === 'send'){
    var noteKey = (n.msg === 'm1') ? ('m1' + S.cold) : n.msg;
    var noteText = COPY.notes[noteKey] || COPY.notes[n.msg];
    body += '<div class="note" id="note"><b>'+esc(MSG_TITLE[n.msg])+' · why this works</b><p>'+esc(noteText)+'</p></div>'
      + '<div class="nav"><button class="back" id="back" aria-label="Back">'
      + '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'
      + '<button class="btn" id="next" data-next="'+n.next+'">'+(node(n.next).k==='end'?'See the outcome':'Continue')+'</button></div>';
  }

  if (n.k === 'choice'){
    var prevSend = null;
    for (var pi = S.trail.length - 1; pi >= 0; pi--){
      var pn = node(S.trail[pi]);
      if (pn && pn.k === 'send'){ prevSend = pn; break; }
    }
    if (prevSend){
      var pk = (prevSend.msg === 'm1') ? ('m1' + S.cold) : prevSend.msg;
      body += '<div class="note"><b>'+esc(MSG_TITLE[prevSend.msg])+' · why this works</b><p>'
            + esc(COPY.notes[pk] || COPY.notes[prevSend.msg])+'</p></div>';
    }
    var opts = openOpts(n), o = '';
    for (var i = 0; i < opts.length; i++){
      var op = opts[i];
      var label = op.label || I[op.kind][r];
      var quiet = op.kind === 'none';
      o += '<button class="reply'+(quiet?' quiet':'')+'" data-go="'+op.next+'">'+esc(label)
         + (op.tag ? '<span class="tag">'+esc(op.tag)+'</span>' : '') + '</button>';
    }
    var prompt = (opts.length < n.opts.length)
      ? 'This one goes differently. You have seen where the other branch ends.'
      : n.prompt;
    body += '<div class="choices"><h4>'+esc(prompt)+'</h4>'+o+'</div>'
      + '<div class="nav"><button class="back" id="back" aria-label="Back">'
      + '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button></div>';
  }

  return body + '<p class="compliance">'+esc(CONFIG.compliance)+'</p></div>';
}

function screenInbox(){
  var C = CONFIG.act2, t = tally(), day = CONFIG.revealDays[S.dayIdx];
  var lastDay = S.dayIdx >= CONFIG.revealDays.length - 1;

  /* tally bar, the whole point of act 2 */
  var chips = '<b>' + CONFIG.campaignSize + '</b> ' + esc(C.tally.messaged);
  var parts = [['booked', t.booked], ['declined', t.declined], ['noreply', t.noreply]];
  for (var q = 0; q < parts.length; q++)
    if (parts[q][1]) chips += ' <i>·</i> <b>' + parts[q][1] + '</b> ' + esc(C.tally[parts[q][0]]);
  if (t.waiting) chips += ' <i>·</i> <b>' + t.waiting + '</b> ' + esc(C.tally.waiting);

  var rows = '';
  for (var i = 0; i < S.campaign.length; i++){
    var L = S.campaign[i];
    var live = L.resolveDay <= day;
    var st = live ? L.outcome : 'waiting';
    var preview = live && L.reply ? L.reply
                : live ? 'Never replied.'
                : 'Message sent. Nothing back yet.';
    var star = (live && L.outcome === 'booked' && L.stage === 'm4');
    rows += '<button class="row'+(star?' star':'')+'" data-lead="'+i+'">'
          + '<div class="row-av">'+esc(L.name.charAt(0))+'</div>'
          + '<div class="row-main"><div class="row-top"><b>'+esc(L.name)+'</b>'
          + '<span class="chip '+st+'">'+esc(COPY.campaign.statusLabels[st])+'</span></div>'
          + '<p>'+esc(preview)+'</p>'
          + (star ? '<span class="flag">'+esc(C.m4Flag)+'</span>' : '')
          + (L.byUser ? '<span class="mine">'+esc(COPY.campaign.handled)+'</span>' : '')
          + '</div></button>';
  }

  var head = lastDay
    ? '<div class="end" style="text-align:left"><h2>'+esc(COPY.campaign.done.title)+'</h2>'
      + '<div class="body" style="margin-bottom:0">'
      + esc(COPY.campaign.done.body).replace(/\n\n/g,'<br><br>')+'</div></div>'
    : '<p class="sub" style="margin-bottom:18px">'+esc(C.lede)+'</p>';

  var ctrl = lastDay
    ? '<button class="btn" id="tocopy">'+esc(C.continueCta)+'</button>'
      + '<div class="nav" style="margin-top:9px">'
      + '<button class="btn ghost sm" id="dayback">Back a day</button>'
      + '<button class="btn ghost sm" id="restart">Start again</button></div>'
      + offerLineHtml()
    : '<button class="btn" id="nextday">'+esc(C.advance)+' '
      + CONFIG.revealDays[S.dayIdx + 1] + '</button>'
      + '<div class="nav" style="margin-top:9px">'
      + '<button class="btn ghost sm" id="dayback">Back</button>'
      + '<button class="btn ghost sm" id="skipday">'+esc(C.skip)+'</button></div>';

  var bars = '';
  for (var b = 0; b < CONFIG.revealDays.length; b++)
    bars += '<i class="'+(b < S.dayIdx ? 'done' : b === S.dayIdx ? 'now' : '')+'"></i>';

  return '<div class="screen on">'
    + '<div class="rail">'+bars+'</div>'
    + head
    + '<div class="tally"><div class="tally-nums">'+chips+'</div>'
      + '<div class="tally-day">Day '+day+'</div></div>'
    + '<p class="daynote">'+esc(COPY.campaign.dayNotes[day])+'</p>'
    + '<div class="rows">'+rows+'</div>'
    + ctrl
    + '<p class="compliance">'+esc(CONFIG.compliance)+'</p></div>';
}

function screenThread(){
  var L = S.campaign[S.openLead], beats = threadFor(L), lastLabel = null, body = '';
  for (var i = 0; i < beats.length; i++){
    var bt = beats[i];
    if (bt.t === 'out'){
      var dl = DAY_LABEL[bt.day];
      if (dl !== lastLabel){ body += '<div class="daystamp">'+esc(dl)+'</div>'; lastLabel = dl; }
      body += '<div class="bubble out">'+esc(S.seq[bt.msg])+'</div>';
    } else if (bt.t === 'in'){
      body += '<div class="bubble in">'+esc(bt.text)+'</div>';
    } else {
      body += '<div class="bubble silent">'+esc(bt.text)+'</div>';
    }
  }
  var st = L.resolveDay <= CONFIG.revealDays[S.dayIdx] ? L.outcome : 'waiting';
  return '<div class="screen on">'
    + '<div class="thread-head"><button class="back" id="toinbox" aria-label="Back to inbox">'
      + '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'
      + '<div><b>'+esc(L.name)+'</b><small>'+esc(COPY.industries[S.industry].who)
      + (L.byUser ? ' · '+esc(COPY.campaign.handled) : '')+'</small></div>'
      + '<span class="chip '+st+'">'+esc(COPY.campaign.statusLabels[st])+'</span></div>'
    + '<div class="phone"><div class="thread">'+body+'</div></div>'
    + '<button class="btn ghost" id="toinbox2" style="margin-top:14px">Back to all ten</button>'
    + '</div>';
}

function sequenceText(){
  var lines = [
    'REACTIVATION SEQUENCE',
    COPY.industries[S.industry].label + ' · ' + bandLabel(S.value) + ' average job · cold for ' + COPY.openers[S.cold].label.toLowerCase(),
    'Replace ' + CONFIG.sender + ' and ' + CONFIG.business + ' before sending.',
    ''
  ];
  var order = [
    ['m1',  'MESSAGE 1: ' + MSG_TITLE.m1  + ' (' + DAY_LABEL.m1 + ')'],
    ['m2a', 'MESSAGE 2A: ' + MSG_TITLE.m2a + ' (send the moment they reply interested)'],
    ['m2b', 'MESSAGE 2B: ' + MSG_TITLE.m2b + ' (send if they say no, then stop)'],
    ['m2c', 'MESSAGE 2C: ' + MSG_TITLE.m2c + ' (' + DAY_LABEL.m2c + ', only if no reply)'],
    ['m3',  'MESSAGE 3: '  + MSG_TITLE.m3  + ' (' + DAY_LABEL.m3  + ', only if still no reply)'],
    ['m4',  'MESSAGE 4: '  + MSG_TITLE.m4  + ' (' + DAY_LABEL.m4  + ', only if still no reply)']
  ];
  for (var i = 0; i < order.length; i++){
    lines.push(order[i][1]); lines.push(S.seq[order[i][0]]); lines.push('');
  }
  lines.push('---');
  lines.push('If they reply to any message, stop the sequence and send message 2A.');
  lines.push('If they say no, send message 2B and stop. A no is a result.');
  lines.push('Opt-out wording and local rules are your responsibility.');
  lines.push('');
  lines.push('Built with the Reactivation Sequence Builder · ' + CONFIG.bookingUrl);
  return lines.join('\n');
}

/* ============================ RENDER + WIRING ============================ */

function on(id, ev, fn){ var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }

function render(){
  var n = cur();
  if (S.screen === 'walk' && n && n.k === 'end'){
    S.outcome = n.outcome;
    /* record where this guided lead landed. idempotent, so replaying
       forward after a back does not double-count */
    S.leadOutcomes[S.leadIdx] = { outcome:n.outcome, stage:stageOfTrail(n.outcome) };
    S.leadOutcomes.length = S.leadIdx + 1;
    S.screen = 'end';
  }

  if      (S.screen === 'intro')  app.innerHTML = screenIntro();
  else if (S.screen === 'walk')   app.innerHTML = screenWalk();
  else if (S.screen === 'end')    app.innerHTML = screenEnd();
  else if (S.screen === 'myinbox')app.innerHTML = screenMyInbox();
  else if (S.screen === 'inbox')  app.innerHTML = screenInbox();
  else if (S.screen === 'thread') app.innerHTML = screenThread();
  else if (S.screen === 'copy')   app.innerHTML = screenCopy();

  wire();

  /* the inbox keeps its place when you come back out of a thread */
  var rowsEl = document.querySelector('.rows');
  if (S.screen === 'inbox' && rowsEl) window.scrollTo(0, S.inboxScroll);
  if (S.screen === 'thread') window.scrollTo(0, 0);

  var cr = document.getElementById('crumbs');
  if (cr) cr.scrollLeft = cr.scrollWidth;
  var th = document.getElementById('thread');
  if (th) th.scrollTop = th.scrollHeight;

  /* land the newest message after a brief typing indicator */
  var typing = document.getElementById('typing');
  if (typing){
    var beat = node(S.animate);
    var done = function(){
      var b = document.createElement('div');
      b.className = 'bubble out';
      b.textContent = S.seq[beat.msg];
      if (typing.parentNode) typing.parentNode.replaceChild(b, typing);
      S.animate = null;
      var t = document.getElementById('thread');
      if (t) t.scrollTop = t.scrollHeight;
    };
    if (reduced) done(); else setTimeout(done, CONFIG.typingMs);
  }
}

function wire(){
  /* ---- intro ---- */
  on('f-ind','change',  function(e){ S.industry = e.target.value; render(); });
  on('f-val','change',  function(e){ S.value = e.target.value; render(); });
  on('f-cold','change', function(e){ S.cold = e.target.value; render(); });
  on('cur-gbp','click', function(){ S.cur = '£'; render(); });
  on('cur-usd','click', function(){ S.cur = '$'; render(); });
  on('go','click', function(){
    if (!(S.industry && S.value && S.cold)) return;
    S.seq = buildSequence(S.industry, S.value, S.cold);
    S.screen = 'myinbox';
    render();
  });

  /* ---- naming the lead ---- */
  var addLead = function(){
    var el = document.getElementById('leadname');
    var v  = (el && el.value || '').trim().replace(/\s+/g, ' ');
    if (!v){
      var e = document.getElementById('nameerr');
      if (e) e.classList.add('on');
      if (el) el.focus();
      return;
    }
    S.leadName = v;
    render();
  };
  on('addlead','click', addLead);
  on('leadname','keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); addLead(); } });
  on('rename','click', function(){ S.leadName = ''; render(); });
  on('tointro','click', function(){ S.screen = 'intro'; render(); });
  on('startlead','click', function(){
    S.trail = ['m1']; S.history = []; S.animate = 'm1';
    S.leadIdx = 0; S.leadOutcomes = []; S.screen = 'walk';
    render();
  });

  /* ---- walkthrough ---- */
  on('next','click', function(e){ go(e.currentTarget.getAttribute('data-next')); });
  var reps = document.querySelectorAll('[data-go]');
  for (var i = 0; i < reps.length; i++){
    reps[i].addEventListener('click', function(e){ go(e.currentTarget.getAttribute('data-go')); });
  }
  on('back','click', function(){
    if (S.screen === 'end'){ S.screen = 'walk'; back(); return; }
    if (!S.history.length){ S.screen = 'myinbox'; render(); return; }   /* first step -> inbox */
    back();
  });

  /* ---- act 1 -> act 2 ---- */
  on('nextlead','click', function(){
    S.leadIdx++;
    S.trail = ['m1']; S.history = []; S.animate = 'm1'; S.screen = 'walk';
    render();
  });
  on('toact2','click', function(){
    S.campaign = buildCampaign(S.leadOutcomes);
    S.dayIdx = 0; S.screen = 'inbox'; S.inboxScroll = 0;
    render();
  });

  /* ---- the reveal ---- */
  on('nextday','click', function(){
    if (S.dayIdx < CONFIG.revealDays.length - 1) S.dayIdx++;
    render();
  });
  on('skipday','click', function(){
    S.dayIdx = CONFIG.revealDays.length - 1;
    render();
  });
  on('dayback','click', function(){
    if (S.dayIdx > 0){ S.dayIdx--; render(); }
    else { S.screen = 'end'; render(); }        /* back out of act 2 entirely */
  });

  /* ---- open and close a thread ---- */
  var rws = document.querySelectorAll('[data-lead]');
  for (var w = 0; w < rws.length; w++){
    rws[w].addEventListener('click', function(e){
      S.inboxScroll = window.pageYOffset || document.documentElement.scrollTop || 0;
      S.openLead = parseInt(e.currentTarget.getAttribute('data-lead'), 10);
      S.screen = 'thread';
      render();
    });
  }
  var backToInbox = function(){ S.screen = 'inbox'; S.openLead = null; render(); };
  on('toinbox','click', backToInbox);
  on('toinbox2','click', backToInbox);
  on('restart','click', function(){
    S.trail = ['m1']; S.history = []; S.animate = null;
    S.screen = 'intro'; S.copied = false;
    S.leadIdx = 0; S.leadName = ''; S.leadOutcomes = []; S.campaign = null;
    S.dayIdx = 0; S.openLead = null; S.inboxScroll = 0;
    render();
  });

  /* ---- straight to the sequence: nothing is asked for in return ---- */
  on('tocopy','click', function(){ S.screen = 'copy'; render(); });

  /* ---- copy out ---- */
  on('copy','click', function(){
    var text = sequenceText();
    var finish = function(){ S.copied = true; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(finish, function(){ legacyCopy(text); finish(); });
    } else { legacyCopy(text); finish(); }
  });
}

function legacyCopy(text){
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (err) { /* clipboard unavailable, the text is on screen and selectable */ }
}

/* ============================ BOOT ============================ */
S.cur = detectCur();
render();
</script>
