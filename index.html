<html lang="en">
<head>

<!-- Link preview for LinkedIn, Facebook, WhatsApp, Slack, iMessage.
     These must stay absolute: scrapers do not resolve relative paths, and a
     relative og:image renders no card at all. If the site ever moves, these
     three URLs are the only thing that needs changing. -->

<meta property="og:title"       content="Your old leads are not dead. They are unanswered.">
<meta property="og:description" content="Put your own quiet leads in an inbox and read the five messages that reopen them, including what to send when they ignore you. Free, no signup.">
<meta property="og:url"         content="https://volt-reactivation.netlify.app/">
<meta property="og:image"       content="https://volt-reactivation.netlify.app/og.png?v=2">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt"   content="Your old leads are not dead. They are unanswered.">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="Your old leads are not dead. They are unanswered.">
<meta name="twitter:description" content="Put your own quiet leads in an inbox and read the five messages that reopen them. Free, no signup.">
<meta name="twitter:image"       content="https://volt-reactivation.netlify.app/og.png?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23c8f251'/><path d='M13 3 5 14h5l-1 7 8-11h-5l1-7Z' fill='%231d1d1f'/></svg>">
<style>
/* ---------------------------------------------------------------
   System font first (it ships optical sizing and tracking tables),
   flat surfaces, hairline separators. No gradients anywhere.
   --------------------------------------------------------------- */
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --ink:#1d1d1f;
  --ink2:#6e6e73;
  --ink3:#8e8e93;
  --line:rgba(0,0,0,.12);
  --line2:rgba(0,0,0,.20);
  --accent:#c8f251;
  --in:#e9e9eb;
  --r:13px;
  /* critically damped: settles without overshoot */
  --ease:cubic-bezier(.2,.8,.2,1);
  --resp:360ms;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 15px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding:0 0 56px;
}
.wrap{width:100%; max-width:428px; margin:0 auto; padding:20px 16px 0}
h1,h2,h3,h4{margin:0}
p{margin:0}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent}
a{color:inherit}

/* ---------- masthead ---------- */
.mast{display:flex; align-items:center; gap:8px; margin-bottom:24px}
.mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.mark svg{display:block}
.mast b{font-size:13px; font-weight:600; letter-spacing:-.01em}
.mast span{font-size:13px; color:var(--ink3); letter-spacing:-.01em}

/* ---------- screens ---------- */
.screen{display:none}
.screen.on{display:block; animation:enter var(--resp) var(--ease) both}
@keyframes enter{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

/* ---------- type ----------
   Tracking is size-specific: tight as it grows, near zero at body,
   slightly open for small uppercase labels. */
.eyebrow{font-size:11px; font-weight:590; letter-spacing:.055em; text-transform:uppercase; color:var(--ink3); margin-bottom:14px}
.h1{
  font-size:clamp(29px,7.4vw,34px); font-weight:680;
  letter-spacing:-.026em; line-height:1.08; margin-bottom:14px;
}
.h1 em{font-style:normal; text-decoration:underline; text-decoration-color:var(--accent);
  text-decoration-thickness:3px; text-underline-offset:3px}
.sub{color:var(--ink2); font-size:15.5px; line-height:1.47; letter-spacing:-.008em; margin-bottom:28px}

/* ---------- form ---------- */
.field{margin-bottom:14px}
.field label{display:block; font-size:12.5px; font-weight:590; color:var(--ink2); margin-bottom:7px; letter-spacing:-.005em}
.selwrap{position:relative}
.selwrap::after{
  content:''; position:absolute; right:16px; top:50%; width:7px; height:7px; margin-top:-5px;
  border-right:1.6px solid var(--ink3); border-bottom:1.6px solid var(--ink3);
  transform:rotate(45deg); pointer-events:none
}
select{
  -webkit-appearance:none; appearance:none; width:100%;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  color:var(--ink); padding:14px 40px 14px 14px; font-size:16px; font-weight:450;
  letter-spacing:-.01em; transition:border-color 140ms var(--ease);
}
select:focus{outline:none; border-color:var(--ink)}
select.empty{color:var(--ink3)}

.curr{display:flex; align-items:center; gap:10px; margin:20px 0 24px}
.curr span{font-size:12.5px; color:var(--ink2)}
.toggle{display:inline-flex; background:rgba(0,0,0,.05); border-radius:9px; padding:2px}
.toggle button{padding:5px 14px; border-radius:7px; font-size:13.5px; font-weight:560; color:var(--ink2); transition:none}
.toggle button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* ---------- buttons ----------
   Feedback lands on pointer-down, not on release. */
.btn{
  display:flex; align-items:center; justify-content:center; width:100%;
  background:var(--ink); color:#fff; font-weight:590; font-size:15.5px; letter-spacing:-.014em;
  padding:15px 18px; border-radius:var(--r); text-decoration:none; text-align:center; text-wrap:balance;
  transition:transform 110ms var(--ease), opacity 140ms var(--ease);
}
.btn:active{transform:scale(.975)}
.btn[disabled]{background:transparent; color:var(--ink3); border:1px solid var(--line); cursor:not-allowed}
.btn[disabled]:active{transform:none}
.btn.ghost,.btn.alt{background:var(--card); color:var(--ink); border:1px solid var(--line2); font-weight:530}
.btn.sm{padding:12px 16px; font-size:14.5px}

.foot{margin-top:16px; font-size:12.5px; color:var(--ink3); text-align:center; line-height:1.5; letter-spacing:-.004em}

/* ---------- progress ---------- */
.rail{display:flex; gap:4px; margin-bottom:13px}
.rail i{flex:1; height:2px; border-radius:1px; background:rgba(0,0,0,.10); transition:background 280ms var(--ease)}
.rail i.done{background:var(--ink3)}
.rail i.now{background:var(--ink)}
.crumbs{display:flex; gap:5px; align-items:center; overflow-x:auto; margin-bottom:14px;
  scrollbar-width:none; -ms-overflow-style:none; padding-bottom:2px}
.crumbs::-webkit-scrollbar{display:none}
.crumb{
  flex:0 0 auto; font-size:11.5px; font-weight:560; letter-spacing:-.004em;
  padding:4px 9px; border-radius:7px; background:rgba(0,0,0,.05); color:var(--ink2); white-space:nowrap
}
.crumb.br{background:transparent; color:var(--ink3); font-weight:440}
.crumb.on{background:var(--ink); color:#fff}

/* ---------- phone ---------- */
.phone{background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden}
.phone-top{display:flex; align-items:center; gap:9px; padding:11px 14px; border-bottom:1px solid var(--line)}
.av{width:28px;height:28px;border-radius:50%;background:var(--in);color:var(--ink2);
  display:grid;place-items:center;font-size:12px;font-weight:590;flex:0 0 auto}
.phone-top b{font-size:13.5px; font-weight:590; display:block; line-height:1.25; letter-spacing:-.012em}
.phone-top small{color:var(--ink3); font-size:11.5px; letter-spacing:-.004em}
.thread{padding:14px 12px 16px; min-height:206px; display:flex; flex-direction:column; gap:8px}
.daystamp{align-self:center; font-size:11px; font-weight:590; letter-spacing:.045em;
  text-transform:uppercase; color:var(--ink3); margin:5px 0 3px}
.bubble{
  max-width:84%; padding:9px 13px; border-radius:17px; font-size:15px; line-height:1.4;
  letter-spacing:-.012em; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  animation:land 320ms var(--ease) both;
}
/* arrives from below, the direction it travels is where it came from */
@keyframes land{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.bubble.out{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:5px}
.bubble.in{align-self:flex-start; background:var(--in); border-bottom-left-radius:5px}
.bubble.silent{align-self:center; background:transparent; color:var(--ink3); font-size:12.5px;
  border:1px solid var(--line); border-radius:999px; padding:4px 12px; max-width:none; letter-spacing:-.004em}
.typing{align-self:flex-end; background:var(--in); border-radius:17px; border-bottom-right-radius:5px;
  padding:11px 14px; display:flex; gap:4px; animation:land 320ms var(--ease) both}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3); animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.3} 30%{opacity:.9}}

/* ---------- the teaching note ---------- */
.note{margin-top:14px; background:var(--card); border:1px solid var(--line);
  border-left:2px solid var(--accent); border-radius:var(--r); padding:13px 15px}
.note b{display:block; font-size:11px; font-weight:590; letter-spacing:.055em;
  text-transform:uppercase; color:var(--ink3); margin-bottom:6px}
.note p{font-size:14px; color:var(--ink); line-height:1.5; letter-spacing:-.008em}

/* ---------- branch choices ---------- */
.choices{margin-top:16px}
.choices h4{font-size:12.5px; font-weight:590; color:var(--ink2); margin:0 0 9px; letter-spacing:-.005em}
.reply{
  display:block; width:100%; text-align:left; margin-bottom:8px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 15px; font-size:15px; letter-spacing:-.012em; color:var(--ink);
  transition:transform 110ms var(--ease), border-color 140ms var(--ease);
}
.reply:hover{border-color:var(--line2)}
.reply:active{transform:scale(.985)}
.reply.quiet{background:transparent; color:var(--ink2)}
.reply .tag{display:block; font-size:12px; color:var(--ink3); margin-top:3px; letter-spacing:-.004em}

.nav{display:flex; gap:8px; margin-top:16px}
.nav .btn{flex:1}
.back{flex:0 0 auto; width:50px; background:var(--card); border:1px solid var(--line2);
  border-radius:var(--r); display:grid; place-items:center; color:var(--ink2);
  transition:transform 110ms var(--ease)}
.back:active{transform:scale(.975)}
.back:disabled{opacity:.4; cursor:not-allowed}
.back:disabled:active{transform:none}

/* ---------- endings ---------- */
.end{text-align:center; padding:6px 0 0}
.badge{display:inline-flex; font-size:11px; font-weight:590; letter-spacing:.055em;
  text-transform:uppercase; padding:5px 11px; border-radius:7px; margin-bottom:16px;
  background:rgba(0,0,0,.05); color:var(--ink2)}
.badge.won{background:var(--accent); color:var(--ink)}
.end h2{font-size:23px; font-weight:660; letter-spacing:-.022em; line-height:1.18; margin-bottom:12px}
.end .body{color:var(--ink2); font-size:15px; line-height:1.5; letter-spacing:-.008em; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin-bottom:16px}
.quietoffer{font-size:13.5px; color:var(--ink2); line-height:1.5; margin:18px 0 0;
  text-align:left; letter-spacing:-.006em}
.quietoffer a{font-weight:560; color:var(--ink); text-decoration:underline; text-underline-offset:2px}

/* ---------- copy-out ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px}
.card h2{font-size:21px; font-weight:660; margin-bottom:8px; letter-spacing:-.022em}
.card .lede{color:var(--ink2); font-size:14.5px; margin-bottom:16px; line-height:1.47; letter-spacing:-.008em}
.err{font-size:13px; color:#c1121f; margin-bottom:10px; display:none}
.err.on{display:block}

/* 12px/20px with 14px padding: the box ends exactly on a line, so the
   cut reads as deliberate and needs no fade to explain it. */
.dump{
  background:var(--bg); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:12px; line-height:20px; color:var(--ink2);
  max-height:208px; overflow-y:auto; margin-bottom:9px;
}
.dump span{display:block; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere}
.hint{font-size:12.5px; color:var(--ink3); margin-bottom:13px; letter-spacing:-.004em}
.textlink{display:block; width:100%; text-align:center; padding:12px; font-size:13.5px;
  color:var(--ink2); text-decoration:underline; text-underline-offset:3px}

.offer{margin-top:18px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px}
.offer::before{content:''; display:block; width:26px; height:2px; background:var(--accent); margin-bottom:14px}
.offer h3{font-size:19px; font-weight:660; margin-bottom:11px; letter-spacing:-.022em; line-height:1.25}
.terms{list-style:none; margin:0 0 17px; padding:0; border-top:1px solid var(--line)}
.terms li{border-bottom:1px solid var(--line); padding:10px 0; font-size:14px;
  color:var(--ink); letter-spacing:-.008em; line-height:1.4}
.offer p{color:var(--ink2); font-size:15px; line-height:1.5; letter-spacing:-.008em; margin-bottom:11px}
.offer p:last-of-type{margin-bottom:17px}
.compliance{margin-top:22px; font-size:12px; color:var(--ink3); line-height:1.5; letter-spacing:-.004em}

/* ---------- act 1: the inbox where they name a lead ---------- */
.inbox-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:9px}
.inbox-head h2{font-size:23px; font-weight:660; letter-spacing:-.022em}
.inbox-meta{flex:0 0 auto; font-size:11.5px; color:var(--ink3); letter-spacing:-.004em; text-align:right}
.emptybox{background:var(--card); border:1px dashed var(--line2); border-radius:var(--r);
  padding:20px 16px; text-align:center; font-size:14px; color:var(--ink3);
  letter-spacing:-.006em; line-height:1.5; margin-bottom:14px}
input[type=text]{
  width:100%; background:var(--card); border:1px solid var(--line2); border-radius:var(--r);
  color:var(--ink); padding:14px; font-size:16px; margin-bottom:10px;
  font-family:inherit; letter-spacing:-.01em;
}
input[type=text]:focus{outline:none; border-color:var(--ink)}
.chip.fresh{background:rgba(0,0,0,.05); color:var(--ink2)}

/* ---------- the inbox: rows the owner builds and resolves ---------- */
.tally{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:11px 14px; margin-bottom:12px}
.tally-nums{font-size:14px; color:var(--ink2); letter-spacing:-.008em;
  font-variant-numeric:tabular-nums; line-height:1.45}
.tally-nums b{color:var(--ink); font-weight:640}
.tally-nums i{color:var(--ink3); font-style:normal; margin:0 1px}

.rows{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
.row{background:var(--card); border:1px solid var(--line); border-radius:var(--r)}
.row.set{display:flex; align-items:stretch}
.rowopen{flex:1; min-width:0; display:flex; gap:11px; align-items:flex-start;
  text-align:left; padding:12px 13px; transition:transform 110ms var(--ease)}
.rowopen:active{transform:scale(.99)}
/* delete sits in its own column, hairline-separated, so a tap meant for
   the conversation never lands on it */
.rowdel{flex:0 0 auto; width:42px; font-size:18px; line-height:1; color:var(--ink3);
  border-left:1px solid var(--line); display:grid; place-items:center}
.rowdel:active{color:var(--ink)}
.row-av{width:30px;height:30px;border-radius:50%;background:var(--in);color:var(--ink2);
  display:grid;place-items:center;font-size:12.5px;font-weight:590;flex:0 0 auto}
.row-main{flex:1; min-width:0}
.row-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.row-top b{font-size:14.5px; font-weight:590; letter-spacing:-.012em}
.row-main p{font-size:13px; color:var(--ink3); letter-spacing:-.006em; margin-top:2px}
.row-main p.ask{color:var(--ink2); font-weight:500; margin-bottom:9px}

/* three equal columns so no one answer looks like the default */
.pick{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.pickbtn{min-width:0; background:var(--bg); border:1px solid var(--line2);
  border-radius:9px; padding:9px 4px; font-size:12.5px; font-weight:550;
  letter-spacing:-.01em; color:var(--ink); white-space:nowrap;
  transition:transform 110ms var(--ease), background 140ms}
.pickbtn:hover{background:var(--card)}
.pickbtn:active{transform:scale(.97)}

.chip{flex:0 0 auto; font-size:11px; font-weight:590; letter-spacing:.02em;
  padding:3px 8px; border-radius:6px; white-space:nowrap}
.chip.booked  {background:#1d1d1f; color:#fff}
.chip.declined{background:#f0e6e4; color:#8a3d2f}
.chip.noreply {background:rgba(0,0,0,.05); color:var(--ink3)}
.chip.live    {background:var(--accent); color:var(--ink)}
.chip.new     {background:rgba(0,0,0,.05); color:var(--ink3)}

.thread-head{display:flex; align-items:center; gap:11px; margin-bottom:12px}
.thread-head .back{width:38px; height:38px}
.thread-head div{flex:1; min-width:0}
.thread-head b{display:block; font-size:15px; font-weight:590; letter-spacing:-.014em}
.thread-head small{color:var(--ink3); font-size:12px; letter-spacing:-.004em}

/* the teaching note, now sitting under the message it explains */
.tnote{align-self:flex-start; max-width:88%; margin:2px 0 6px 2px;
  border-left:2px solid var(--accent); padding:2px 0 2px 10px}
.tnote b{display:block; font-size:10.5px; font-weight:590; letter-spacing:.055em;
  text-transform:uppercase; color:var(--ink3); margin-bottom:3px}
.tnote p{font-size:12.5px; color:var(--ink2); line-height:1.45; letter-spacing:-.004em}

/* ---------- the live end of a thread ---------- */
/* the question sits directly under the phone, reading as the next thing
   in the conversation rather than a form below it */
.decide{background:var(--card); border:1px solid var(--line2); border-radius:var(--r);
  padding:14px 13px; margin-top:10px}
.decide .ask{font-size:14.5px; font-weight:550; color:var(--ink);
  letter-spacing:-.01em; margin-bottom:10px; line-height:1.4}

.thread-end{text-align:left; padding:0; margin-top:16px}
.thread-end h2{font-size:20px; margin-bottom:10px}
.thread-end .body{margin-bottom:0}
.thread-cta{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:15px; margin-top:10px}
.thread-cta p{font-size:13.5px; color:var(--ink2); line-height:1.5;
  letter-spacing:-.006em; margin-bottom:12px}

.steplinks{display:flex; gap:18px; justify-content:center; margin-top:8px}
.steplinks .textlink{width:auto; padding:12px 4px; font-size:13px; color:var(--ink3)}

.hint{font-size:12.5px; color:var(--ink3); margin-bottom:10px; letter-spacing:-.004em}

@media (prefers-contrast:more){
  .chip.declined{background:#fff; color:#7a2e21; border:1px solid currentColor}
  .chip.noreply{border:1px solid var(--line2)}
  .pickbtn{border-color:var(--ink2)}
}

@media (max-width:374px){
  .inbox-head{flex-direction:column; align-items:flex-start; gap:2px}
  .pickbtn{min-width:0; flex:1 1 30%; font-size:12.5px; padding:9px 6px}
  .tnote{max-width:100%}
  .inbox-meta{text-align:left}
  .row-top b{font-size:14px}
  .chip{font-size:10.5px; padding:3px 6px}
}

@media (max-width:374px){
  .wrap{padding:16px 12px 0}
  .thread{padding:12px 10px 14px}
  .bubble{font-size:14.5px; max-width:88%}
  .btn{font-size:15px; padding:14px}
  .crumb{font-size:11px; padding:4px 8px}
}

/* ---------- accessibility signals ---------- */
@media (prefers-contrast:more){
  :root{--line:rgba(0,0,0,.42); --line2:rgba(0,0,0,.6); --ink2:#3a3a3c; --ink3:#48484a}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#0d0e12"/></svg></div>
    <b>Volt</b><span>· Reactivation Sequence Builder</span>
  </div>
  <div id="app"></div>
</div>

<script>
/* ============================ CONFIG START ============================ */

var CONFIG = {
  bookingUrl:   'https://calendly.com/caydenrealchern/30min',
  bookingLabel: 'Book a free 30 minute call',
  /* {k} is however many leads the owner actually put in, so the heading
     never claims a demo size they did not run */
  offerHeading: 'That was {k}. Your list is the campaign.',
  offerBody: [
    "Sending is the easy part. The part nobody keeps up with is doing it across every old lead you have: tracking who replies, stopping the sequence the second someone answers. So I run it for you, up to 10,000 leads in one campaign.",
    "Nothing to pay to set it up and nothing to pay to run it. We agree how many reactivated leads you want before anything sends, and the fee is only due once you have them. Miss the number and you owe me nothing.",
    "What a list returns depends on the list, which is exactly why we set that number together rather than me promising you one."

/* ============================ ASSEMBLY ============================ */

function joinParts(parts){
  return parts.filter(function(x){ return x && String(x).trim(); })
              .map(function(x){ return String(x).trim(); })
              .join(' ');
}

function buildSequence(industryKey, valueKey, coldKey){
  var I = COPY.industries[industryKey],
      T = COPY.tones[valueKey],
      O = COPY.openers[coldKey],
      r = T.register;

  var head = (O.pre[r] + ' ' + I.m1ref[r] + O.post[r])
               .replace('{s}', CONFIG.sender)
               .replace('{b}', CONFIG.business);

  return {
    m1:  joinParts([ head, I.m1q[r], T.m1tail ]),
    m2a: joinParts([ T.m2aLead, I.m2a[r], T.m2aTail ]),
    m2b: joinParts([ T.m2bLead, I.m2b[r] ]),
    m2c: joinParts([ I.m2c[r], T.m2cTail ]),
    m3:  joinParts([ I.m3[r], T.m3Tail ]),
    m4:  joinParts([ T.m4Lead, I.m4[r] ])
  };
}

/* The lead's first name only. In a thread it is the real name; in the
   copy-out it stays a bracketed placeholder, because that block is a
   template the owner pastes and fills in per person. */
function firstName(full){ return String(full || '').trim().split(/\s+/)[0] || ''; }
function personalise(text, name){
  return String(text).replace(/\{n\}/g, name ? firstName(name) : CONFIG.namePlaceholder);
}

/* ===================== THE OWNER'S LEADS =====================
   A flat list the owner builds themselves. No name is invented, and no
   outcome is either: each lead carries a path, which is the list of
   answers the owner has given so far, one per message they have sent.
   An empty path means the sequence has not started for that lead.       */

/* the four sends that can carry a decision after them */
var STAGES = ['m1', 'm2c', 'm3', 'm4'];

/* what silence looks like between one send and the next */
var GAPS = ['three days pass, nothing',
            'four more days, still nothing',
            'a week goes by, still nothing'];

function addLead(name){
  if (S.leads.length >= CONFIG.maxLeads) return false;
  S.leads.push({ name:name, path:[] });
  return true;
}

/* Walk the lead's answers into the conversation so far. Returns the beats
   to draw, and either the stage still waiting on an answer or the ending
   the path arrived at. Nothing here decides anything: every branch taken
   is an answer the owner clicked. */
function walk(L){
  var beats = [{ t:'out', msg:'m1', day:'m1' }], i = 0;

  for (i = 0; i < L.path.length; i++){
    var answer = L.path[i];

    if (answer === 'yes'){
      beats.push({ t:'in', kind:'yes' });
      beats.push({ t:'out', msg:'m2a', day:'reply' });
      /* a reply off message 3 or 4 is a different lesson from a reply
         off message 1, so it gets its own ending */
      return { beats:beats, stage:-1, ending: i >= 2 ? 'wonLate' : 'won' };
    }
    if (answer === 'no'){
      beats.push({ t:'in', kind:'no' });
      beats.push({ t:'out', msg:'m2b', day:'reply' });
      return { beats:beats, stage:-1, ending:'parked' };
    }
    /* silence: either the next send, or the end of the road */
    if (i === STAGES.length - 1)
      return { beats:beats, stage:-1, ending:'cleaned' };

    beats.push({ t:'silent', text:GAPS[i] });
    beats.push({ t:'out', msg:STAGES[i + 1], day:STAGES[i + 1] });
  }

  /* no answer yet for the message just sent */
  return { beats:beats, stage:i, ending:null };
}

function statusOf(L){
  if (!L.path.length) return 'new';
  var w = walk(L);
  if (w.ending === 'won' || w.ending === 'wonLate') return 'booked';
  if (w.ending === 'parked')  return 'declined';
  if (w.ending === 'cleaned') return 'noreply';
  return 'live';
}

function tally(){
  var t = { booked:0, declined:0, noreply:0, live:0, new:0 };
  for (var i = 0; i < S.leads.length; i++) t[statusOf(S.leads[i])]++;
  return t;
}

/* the sequence is offered once one conversation has actually run out */
function anyDone(){
  for (var i = 0; i < S.leads.length; i++){
    var st = statusOf(S.leads[i]);
    if (st === 'booked' || st === 'declined' || st === 'noreply') return true;
  }
  return false;
}

  if (CONFIG.currencyDefault) return CONFIG.currencyDefault;
  var l = (navigator.language || 'en-GB');
  return /^en-GB|^cy|^gd/i.test(l) ? '£' : '$';
}

function esc(t){
  return String(t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* ============================ SCREENS ============================ */

function screenIntro(){
  var inds = Object.keys(COPY.industries).map(function(k){
    return '<option value="'+k+'"'+(S.industry===k?' selected':'')+'>'+esc(COPY.industries[k].label)+'</option>';
  }).join('');
  var vals = Object.keys(COPY.tones).map(function(k){
    return '<option value="'+k+'"'+(S.value===k?' selected':'')+'>'+esc(bandLabel(k))+'</option>';
  }).join('');
  var colds = Object.keys(COPY.openers).map(function(k){
    return '<option value="'+k+'"'+(S.cold===k?' selected':'')+'>'+esc(COPY.openers[k].label)+'</option>';
  }).join('');
  var ready = S.industry && S.value && S.cold;

  return '<div class="screen on">'
    + '<div class="eyebrow">Free tool · no signup</div>'
    + '<h1 class="h1">Your old leads are<br>not dead. They are<br><em>unanswered.</em></h1>'
    + '<p class="sub">Answer three questions and walk through the five-message sequence that reopens them, including what to send when they go quiet, which is where almost every campaign falls over.</p>'
    + '<div class="field"><label for="f-ind">What do you do?</label><div class="selwrap">'
      + '<select id="f-ind" class="'+(S.industry?'':'empty')+'"><option value="" disabled'+(S.industry?'':' selected')+'>Choose your industry</option>'+inds+'</select></div></div>'
    + '<div class="field"><label for="f-val">Average job value</label><div class="selwrap">'
      + '<select id="f-val" class="'+(S.value?'':'empty')+'"><option value="" disabled'+(S.value?'':' selected')+'>Choose a range</option>'+vals+'</select></div></div>'
    + '<div class="field"><label for="f-cold">How long have these leads been cold?</label><div class="selwrap">'
      + '<select id="f-cold" class="'+(S.cold?'':'empty')+'"><option value="" disabled'+(S.cold?'':' selected')+'>Choose a timeframe</option>'+colds+'</select></div></div>'
    + '<div class="curr"><span>Currency</span><div class="toggle">'
      + '<button id="cur-gbp" aria-pressed="'+(S.cur==='£')+'">£</button>'
      + '<button id="cur-usd" aria-pressed="'+(S.cur==='$')+'">$</button></div></div>'
    + '<button class="btn" id="go"'+(ready?'':' disabled')+'>'+(ready?'Build my sequence':'Answer all three to continue')+'</button>'
    + '<p class="foot">Nothing is sent, nothing is stored, and there is no signup. The sequence is yours to copy at the end.</p>'
    + '</div>';
}

function tallyHtml(){
  var t = tally(), L = CONFIG.tallyLabels, out = '<b>'+S.leads.length+'</b> '+esc(L.leads);
  var parts = [['booked',t.booked], ['declined',t.declined], ['noreply',t.noreply],
               ['live',t.live], ['new',t['new']]];
  for (var i = 0; i < parts.length; i++)
    if (parts[i][1]) out += ' <i>·</i> <b>'+parts[i][1]+'</b> '+esc(L[parts[i][0]]);
  return '<div class="tally"><div class="tally-nums">'+out+'</div></div>';
}

function offerLineHtml(){
  return '<p class="quietoffer">'+esc(CONFIG.quietOffer)
    + '<a href="'+esc(CONFIG.bookingUrl)+'" target="_blank" rel="noopener">'+esc(CONFIG.quietOfferLink)+'</a>.</p>';
}

function screenInbox(){
  var E = CONFIG.leadEntry, full = S.leads.length >= CONFIG.maxLeads, rows = '';

  for (var i = 0; i < S.leads.length; i++){
    var L = S.leads[i], st = statusOf(L),
        initial = esc(L.name.charAt(0).toUpperCase()),
        hint = st === 'new' ? E.openNew : st === 'live' ? E.openLive : E.openDone;
    /* every row opens the same way: the conversation is where the work is */
    rows += '<div class="row set">'
      + '<button class="rowopen" data-lead="'+i+'">'
        + '<div class="row-av">'+initial+'</div>'
        + '<div class="row-main"><div class="row-top"><b>'+esc(L.name)+'</b>'
          + '<span class="chip '+st+'">'+esc(STATUS[st])+'</span></div>'
        + '<p>'+esc(hint)+'</p></div></button>'
      + '<button class="rowx rowdel" data-remove="'+i+'" aria-label="Remove '+esc(L.name)+'">&times;</button>'
      + '</div>';
  }

  return '<div class="screen on">'
    + '<div class="inbox-head"><h2>'+esc(E.title)+'</h2>'
      + '<span class="inbox-meta">'+esc(COPY.industries[S.industry].label)+' · '+esc(bandLabel(S.value))+'</span></div>'
    + '<p class="sub" style="margin-bottom:18px">'+esc(E.lede)+'</p>'
    + (S.leads.length ? tallyHtml() : '')
    + (rows ? '<div class="rows">'+rows+'</div>' : '<p class="emptybox">'+esc(E.empty)+'</p>')
    + '<div class="err" id="nameerr"></div>'
    + (full
        ? '<p class="hint">'+esc(E.full)+'</p>'
        : '<input type="text" id="leadname" placeholder="'+esc(E.placeholder)+'" autocomplete="off"'
          + ' autocapitalize="words" maxlength="40" enterkeyhint="done">'
          + '<button class="btn alt" id="addlead">'+esc(E.add)+'</button>')
    + (anyDone()
        ? '<button class="btn" id="tocopy" style="margin-top:10px">'+esc(E.continueCta)+'</button>'
        : (S.leads.length ? '<p class="hint" style="margin-top:10px">'+esc(E.needOne)+'</p>' : ''))
    + '<div class="nav" style="margin-top:14px">'
      + '<button class="btn ghost sm" id="tointro">Change my answers</button></div>'
    + '<p class="compliance">'+esc(CONFIG.compliance)+'</p></div>';
}

/* one outgoing message plus the note that explains why it is written
   the way it is */
function sendHtml(msg, name, lastLabel){
  var out = '', dl = DAY_LABEL[msg === 'm2a' || msg === 'm2b' ? 'reply' : msg];
  if (dl !== lastLabel.v){ out += '<div class="daystamp">'+esc(dl)+'</div>'; lastLabel.v = dl; }
  out += '<div class="bubble out">'+esc(personalise(S.seq[msg], name))+'</div>';
  var key = (msg === 'm1') ? ('m1' + S.cold) : msg;
  return out + '<div class="tnote"><b>'+esc(MSG_TITLE[msg])+'</b>'
             + '<p>'+esc(COPY.notes[key] || COPY.notes[msg])+'</p></div>';
}

function screenThread(){
  var L = S.leads[S.openLead], I = COPY.industries[S.industry],
      r = COPY.tones[S.value].register, T = CONFIG.thread,
      w = walk(L), st = statusOf(L),
      lastLabel = { v:null }, body = '';

  for (var i = 0; i < w.beats.length; i++){
    var bt = w.beats[i];
    if      (bt.t === 'out')    body += sendHtml(bt.msg, L.name, lastLabel);
    else if (bt.t === 'in')     body += '<div class="bubble in">'+esc(I[bt.kind][r])+'</div>';
    else                        body += '<div class="bubble silent">'+esc(bt.text)+'</div>';
  }

  /* the live end of the thread: either a question, or the ending */
  var tail = '';
  if (w.stage >= 0){
    var q = w.stage === 0 ? personalise(T.ask, L.name)
          : w.stage === STAGES.length - 1 ? T.askLast
          : T.askAgain;
    tail = '<div class="decide" id="decide">'
      + '<p class="ask">'+esc(q)+'</p>'
      + '<div class="pick">'
        + '<button class="pickbtn" data-step="yes">'+esc(T.yes)+'</button>'
        + '<button class="pickbtn" data-step="no">'+esc(T.no)+'</button>'
        + '<button class="pickbtn" data-step="silent">'
          + esc(w.stage === 0 ? T.silent : T.silentAgain)+'</button>'
      + '</div></div>';
  } else {
    var e = COPY.endings[w.ending];
    tail = '<div class="end thread-end" id="decide">'
      + '<h2>'+esc(e.title)+'</h2>'
      + '<div class="body">'+esc(e.body).replace(/\n\n/g,'<br><br>')+'</div>'
      /* the ask sits at the bottom of the conversation it just earned */
      + '<div class="thread-cta">'
        + '<p>'+esc(T.ctaLead)+'</p>'
        + '<a class="btn" href="'+esc(CONFIG.bookingUrl)+'" target="_blank" rel="noopener" id="book-thread">'
          + esc(CONFIG.bookingLabel)+'</a>'
      + '</div></div>';
  }

  return '<div class="screen on">'
    + '<div class="thread-head"><button class="back" id="toinbox" aria-label="Back to inbox">'
      + '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'
      + '<div><b>'+esc(L.name)+'</b><small>'+esc(I.who)+'</small></div>'
      /* mid-conversation the chip carries the day, because "not started"
         is a lie once message 1 is on screen */
      + (w.stage >= 0
          ? '<span class="chip live">'+esc(DAY_LABEL[STAGES[w.stage]])+'</span>'
          : '<span class="chip '+st+'">'+esc(STATUS[st])+'</span>')
    + '</div>'
    + '<div class="phone"><div class="thread">'+body+'</div></div>'
    + tail
    /* quiet text links: a misclick needs a way back, but it must never
       outweigh the question being asked */
    + (L.path.length
        ? '<div class="steplinks"><button class="textlink" id="undo">'+esc(T.undo)+'</button>'
          + '<button class="textlink" id="reset">'+esc(T.restart)+'</button></div>'
        : '')
    + '<button class="btn ghost" id="toinbox2" style="margin-top:16px">Back to the inbox</button>'
    + '</div>';
}

function sequenceText(){
  var lines = [
    'REACTIVATION SEQUENCE',
    COPY.industries[S.industry].label + ' · ' + bandLabel(S.value) + ' average job · cold for ' + COPY.openers[S.cold].label.toLowerCase(),
    S.leads.length + (S.leads.length === 1 ? ' lead in your inbox' : ' leads in your inbox'),
    'Replace ' + CONFIG.namePlaceholder + ', ' + CONFIG.sender + ' and ' + CONFIG.business + ' before sending.',
    ''
  ];
  var order = [
    ['m1',  'MESSAGE 1: ' + MSG_TITLE.m1  + ' (' + DAY_LABEL.m1 + ')'],
    ['m2a', 'MESSAGE 2A: ' + MSG_TITLE.m2a + ' (send the moment they reply interested)'],
    ['m2b', 'MESSAGE 2B: ' + MSG_TITLE.m2b + ' (send if they say no, then stop)'],
    ['m2c', 'MESSAGE 2C: ' + MSG_TITLE.m2c + ' (' + DAY_LABEL.m2c + ', only if no reply)'],
    ['m3',  'MESSAGE 3: '  + MSG_TITLE.m3  + ' (' + DAY_LABEL.m3  + ', only if still no reply)'],
    ['m4',  'MESSAGE 4: '  + MSG_TITLE.m4  + ' (' + DAY_LABEL.m4  + ', only if still no reply)']
  ];
  for (var i = 0; i < order.length; i++){
    lines.push(order[i][1]);
    lines.push(personalise(S.seq[order[i][0]], ''));   /* {n} out, [name] in */
    lines.push('');
  }
  lines.push('---');
  lines.push('If they reply to any message, stop the sequence and send message 2A.');
  lines.push('If they say no, send message 2B and stop. A no is a result.');
  lines.push('Opt-out wording and local rules are your responsibility.');
  lines.push('');
  lines.push('Built with the Reactivation Sequence Builder · ' + CONFIG.bookingUrl);
  return lines.join('\n');
}

function screenCopy(){
  return '<div class="screen on"><div class="card">'
    + '<h2>Your sequence</h2>'
    + '<p class="lede">All five messages with their timings. Paste it wherever you send from.</p>'
    + '<div class="dump" id="out"><span>'+esc(sequenceText())+'</span></div>'
    + '<p class="hint">Scroll the box for the rest of the sequence.</p>'
    + (S.copied
        ? '<button class="textlink" id="copy">Copied. Copy again</button>'
        : '<button class="btn alt" id="copy">Copy the whole sequence</button>')
    + '</div>'
    + '<div class="offer">'
      + '<h3>'+esc(CONFIG.offerHeading.replace(/\{k\}/g, leadCount()))+'</h3>'
      + CONFIG.offerBody.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('')
      + '<ul class="terms">'
      + CONFIG.offerTerms.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('')
      + '</ul>'
      + '<a class="btn" href="'+esc(CONFIG.bookingUrl)+'" target="_blank" rel="noopener" id="book">'+esc(CONFIG.bookingLabel)+'</a>'
    + '</div>'
    + '<button class="textlink" id="restart">Start again with different answers</button>'
    + offerLineHtml()
    + '<p class="compliance">'+esc(CONFIG.compliance)+'</p>'
    + '</div>';
}

/* ============================ RENDER + WIRING ============================ */

function on(id, ev, fn){ var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }

function render(){
  if      (S.screen === 'intro')  app.innerHTML = screenIntro();
  else if (S.screen === 'inbox')  app.innerHTML = screenInbox();
  else if (S.screen === 'thread') app.innerHTML = screenThread();
  else if (S.screen === 'copy')   app.innerHTML = screenCopy();

  wire();

  if (S.screen === 'inbox')  window.scrollTo(0, S.inboxScroll);
  if (S.screen === 'thread'){
    /* answering a question keeps you where the conversation is; opening a
       thread starts you at the top of it */
    if (S.keepPlace){
      S.keepPlace = false;
      var d = document.getElementById('decide');
      if (d) d.scrollIntoView({ block:'center', behavior: reduced ? 'auto' : 'smooth' });
    } else {
      window.scrollTo(0, 0);
    }
  }
}

function wire(){
  /* ---- intro ---- */
  on('f-ind','change',  function(e){ S.industry = e.target.value; render(); });
  on('f-val','change',  function(e){ S.value = e.target.value; render(); });
  on('f-cold','change', function(e){ S.cold = e.target.value; render(); });
  on('cur-gbp','click', function(){ S.cur = '£'; render(); });
  on('cur-usd','click', function(){ S.cur = '$'; render(); });
  on('go','click', function(){
    if (!(S.industry && S.value && S.cold)) return;
    S.seq = buildSequence(S.industry, S.value, S.cold);
    S.screen = 'inbox';
    render();
  });
  on('tointro','click', function(){ S.screen = 'intro'; render(); });

  /* ---- adding a lead ---- */
  var showErr = function(msg){
    var e = document.getElementById('nameerr');
    if (e){ e.textContent = msg; e.classList.add('on'); }
  };
  var add = function(){
    var el = document.getElementById('leadname');
    var v  = (el && el.value || '').trim().replace(/\s+/g, ' ');
    if (!v) return showErr(CONFIG.leadEntry.error);
    for (var i = 0; i < S.leads.length; i++)
      if (S.leads[i].name.toLowerCase() === v.toLowerCase())
        return showErr(CONFIG.leadEntry.dupe);
    if (!addLead(v)) return showErr(CONFIG.leadEntry.full);
    render();
    var next = document.getElementById('leadname');
    if (next) next.focus();
  };
  on('addlead','click', add);
  on('leadname','keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); add(); } });

  /* ---- setting, changing and removing outcomes ---- */
  var each = function(sel, fn){
    var els = document.querySelectorAll(sel);
    for (var i = 0; i < els.length; i++) els[i].addEventListener('click', fn);
  };
  each('[data-remove]', function(e){
    S.leads.splice(parseInt(e.currentTarget.getAttribute('data-remove'), 10), 1);
    render();
  });

  /* ---- answering the question at the live end of a thread ---- */
  each('[data-step]', function(e){
    var L = S.leads[S.openLead];
    if (!L) return;
    L.path.push(e.currentTarget.getAttribute('data-step'));
    S.keepPlace = true;
    render();
  });
  on('undo','click', function(){
    var L = S.leads[S.openLead];
    if (L && L.path.length){ L.path.pop(); S.keepPlace = true; render(); }
  });
  on('reset','click', function(){
    var L = S.leads[S.openLead];
    if (L){ L.path = []; render(); }
  });

  /* ---- opening and closing a thread ---- */
  each('[data-lead]', function(e){
    S.inboxScroll = window.pageYOffset || document.documentElement.scrollTop || 0;
    S.openLead = parseInt(e.currentTarget.getAttribute('data-lead'), 10);
    S.screen = 'thread';
    render();
  });
  var backToInbox = function(){ S.screen = 'inbox'; S.openLead = null; render(); };
  on('toinbox','click', backToInbox);
  on('toinbox2','click', backToInbox);

  /* ---- the sequence, given away with nothing asked in return ---- */
  on('tocopy','click', function(){ S.screen = 'copy'; render(); });
  on('restart','click', function(){
    S.screen = 'intro'; S.leads = []; S.openLead = null;
    S.inboxScroll = 0; S.copied = false;
    render();
  });
  on('copy','click', function(){
    var text = sequenceText();
    var finish = function(){ S.copied = true; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(finish, function(){ legacyCopy(text); finish(); });
    } else { legacyCopy(text); finish(); }
  });
}

function legacyCopy(text){
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (err) { /* clipboard unavailable, the text is on screen and selectable */ }
}

/* ============================ BOOT ============================ */
S.cur = detectCur();
render();
</script>
